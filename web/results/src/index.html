<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="雀魂自動対局の戦績・各対局の結果画面・検証記録"><title>雀魂 Auto — 対局記録</title><link rel="stylesheet" href="style.css"></head><body><header><a href="#" class="brand"><span class="tile">發</span> JANTAMA <b>AUTO</b></a><span class="private">対局アーカイブ</span></header><main><div class="intro"><div><p class="eyebrow">MATCH ARCHIVE</p><h1>一局ずつ、その先へ。</h1><p class="muted">対局結果と、その根拠をひとつの場所に。</p></div><p id="updated" class="muted"></p></div><nav aria-label="対局種別"><button data-mode="ranked" class="active">段位戦</button><button data-mode="friend">友人戦・練習</button><button data-mode="all">すべての記録</button></nav><section id="stats" class="stats" aria-label="戦績サマリー"></section><p id="scope" class="note"></p><section class="toolbar"><label>結果<select id="rank"><option value="all">すべての結果</option><option value="1">1位</option><option value="2">2位</option><option value="3">3位</option><option value="4">4位</option><option value="unknown">順位未確認</option></select></label><label>日付（日本時間）<input id="date" type="date"></label><label class="search">記録を検索<input id="search" type="search" placeholder="実行名・コミット・ルーム"></label><button id="reset" class="secondary">クリア</button><button id="download" class="secondary">CSV保存</button></section><div class="listhead"><h2>対局一覧 <span id="count"></span></h2><span>新しい順 · JST</span></div><div id="list" aria-live="polite"><p>対局記録を読み込んでいます…</p></div><button id="more" class="secondary more" hidden>さらに50件表示</button><footer>段位戦と友人戦の成績は別集計。300+0の動作確認は、短時間設定での性能や段位戦の勝率を示すものではありません。<br>途中終了・終了未確認の実行は掲載・集計していません。データは表示された更新日時のスナップショットです。</footer></main><dialog id="detail"><button id="close" aria-label="詳細を閉じる">閉じる ×</button><div id="detailBody"></div></dialog><script type="module" src="app.js"></script></body></html>
